name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the checks and the build but don't deploy.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue in push order, so an older build never deploys last;
# a new push to a pull request cancels its previous run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  browser-tests:
    name: browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner image's Google Chrome, headless, renders WebGL with SwiftShader.
      - if: matrix.browser == 'chromium'
        run: npx vitest run --project "browser (chromium)"
      # Playwright's Firefox; its system dependencies include the FFmpeg libraries it decodes
      # and encodes H.264 with. Headless, it gets no WebGL context on Linux, so it runs headed
      # under Xvfb and renders with Mesa's llvmpipe.
      - if: matrix.browser == 'firefox'
        run: |
          npx playwright install --with-deps firefox
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            npx vitest run --project "browser (firefox)" --browser.headless=false

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
