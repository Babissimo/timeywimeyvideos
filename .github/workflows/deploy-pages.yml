name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the checks and the build but don't deploy.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue in push order, so an older build never deploys last;
# a new push to a pull request cancels its previous run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Not `npm test`: the browser tests need Chrome with WebGL2 and WebCodecs.
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
